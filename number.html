<html>
<head>
<meta charset="UTF-8"></meta>
<title>根号计算器</title>
<script>
function downloadfile(filename)
{
const a=document.createElement('a');
a.href=filename;
a.download=filename;
document.body.appendChild(a);
a.click();
a.remove();
}
</script>
<style>
body{
 background-color:#121314;
}
.button{
background-color:#87cefa;
text-align:center;
width:100px;
height:50px;
border-radius:8px;
}
</style>
</head>
<body>
<button onclick="downloadfile('number.exe')"class="button">下载计算器</button>
</body>
</html>
